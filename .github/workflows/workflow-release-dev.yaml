name: Get new release and publish to dev

on:
  push:
    branches:
    - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  checkout:
    name: Checkout repository
    runs-on: ubuntu-latest
    outputs:
      repo-path: ${{ steps.set-repo-path.outputs.repo-path }}
      short-sha: ${{ steps.short-sha.outputs.short-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set repo path output
        id: set-repo-path
        run: echo "repo-path=$GITHUB_WORKSPACE" >> $GITHUB_OUTPUT

      - name: Set short commit SHA
        id: short-sha
        run: echo "short-sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  sync-learn-terraform:
    name: Sync to learn-terraform repo
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout learn-terraform repository
        uses: actions/checkout@v4
        with:
          repository: harireddy7/learn-terraform
          ref: main
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Create feature branch
        env:
          SHORT_SHA: ${{ needs.checkout.outputs.short-sha }}
        run: |
          git checkout -b feature/${SHORT_SHA} || git checkout feature/${SHORT_SHA}

      - name: Bump version in package.json
        env:
          SHORT_SHA: ${{ needs.checkout.outputs.short-sha }}
        run: |
          if [ -f package.json ]; then
            node -e "const fs=require('fs');let p=JSON.parse(fs.readFileSync('package.json'));p.version='${SHORT_SHA}';fs.writeFileSync('package.json', JSON.stringify(p,null,2));";
            git add package.json;
            git commit -m "chore: bump version to ${SHORT_SHA}" || echo "No changes to commit";
          else
            echo "package.json not found" && exit 1;
          fi

      - name: Push branch
        env:
          SHORT_SHA: ${{ needs.checkout.outputs.short-sha }}
        run: |
          git push -u origin feature/${SHORT_SHA} --force

      - name: Create PR
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          SHORT_SHA: ${{ needs.checkout.outputs.short-sha }}
        run: |
          gh pr create --base main --head feature/${SHORT_SHA} --title "feat: bump version to ${SHORT_SHA} [skip ci]" --body "Automated version bump to commit id ${SHORT_SHA}." || echo "PR may already exist"
          gh pr view --json number --jq .number > pr_number.txt
          echo "pr-number=$(cat pr_number.txt)" >> $GITHUB_OUTPUT

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          gh pr merge $(gh pr view --json number --jq .number) --auto --merge || echo "Auto-merge setup failed (ensure repo settings allow it)"
