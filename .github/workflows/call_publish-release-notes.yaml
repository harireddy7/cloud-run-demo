name: Publish release notes to GitHub

on:
  workflow_call:

jobs:
  publish-release-notes:
    name: 📓
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 21.2
        uses: actions/setup-node@v3
        with:
          node-version: '21.2'

      - id: run-semantic-release
        run: |
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} npx semantic-release

      - name: Deployment summary
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "# 📦 dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| **App**         | cloud-run-demo |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version**         | \`1.0.0-dev.55\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment**     | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status**          | Success ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by**    | \`${{ github.event_name }}\` on branch \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp (UTC)** | $TIMESTAMP |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: Deployment summary 2
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "# 📦 stg" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| **App**         | cloud-run-demo |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version**         | \`1.0.0-stg.55\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment**     | stg |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status**          | Success ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by**    | \`${{ github.event_name }}\` on branch \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp (UTC)** | $TIMESTAMP |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
