name: Get next release version from semantic release dry run

on:
  workflow_call:
    outputs:
      release-version:
        value: ${{ jobs.get-release-version.outputs.release-version }}

jobs:
  get-release-version:
    name: 🔖
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.extract-release-version.outputs.release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 21.2
        uses: actions/setup-node@v3
        with:
          node-version: '21.2'

      - id: extract-release-version
        run: |
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} npx semantic-release --dry-run --verbose > release-temp.log
          cat release-temp.log
          RELEASE_VERSION=$(cat release-temp.log | grep -oiP 'the next release version is \K.*')
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Release version - ${{ steps.extract-release-version.outputs.release_version }}
        run: echo "Next release version - ${{ steps.extract-release-version.outputs.release_version }}"

      - name: Deployment summary
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "# 📦 dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| **App**             | cloud-run-demo |" >> $GITHUB_STEP_SUMMARY
          echo "|:--------------------|:---------------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version**         | \`1.0.0-dev.55\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment**     | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by**    | \`${{ github.event_name }}\` on branch \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status**          | Success ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp (UTC)** | $TIMESTAMP |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
